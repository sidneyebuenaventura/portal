name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: university
          POSTGRES_USER: university
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: university
          RABBITMQ_DEFAULT_PASS: password
          RABBITMQ_DEFAULT_VHOST: university
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.core
      SECRET_KEY: ci
      DATABASE_URL: postgres://university:password@localhost:5432/university
      CELERY_BROKER_URL: amqp://university:password@localhost:5672/university
      EVENT_BROKER_URL: amqp://university:password@localhost:5672/university

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest --cov --cov-report=term
